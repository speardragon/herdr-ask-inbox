id = "ray.ask-inbox"
name = "Ask Inbox"
version = "1.0.0"
min_herdr_version = "0.7.5"
description = "Collect blocked Claude AskUserQuestion prompts from every herdr workspace into one popup, answer them in place, and never send an answer to the wrong agent."
platforms = ["macos", "linux"]

[[build]]
command = ["node", "-e", "const major = Number(process.versions.node.split('.')[0]); if (major < 22) { console.error('Node.js >= 22 required'); process.exit(1); }"]

[[build]]
command = ["npm", "test"]

[[build]]
command = ["node", "bin/install-hooks.mjs"]

[[panes]]
id = "question"
title = "Ask Inbox"
placement = "popup"
width = 82
height = 26
command = ["node", "bin/popup.mjs"]

[[actions]]
id = "open"
title = "Ask Inbox: Open pending queue"
contexts = ["global", "workspace", "pane"]
command = ["node", "bin/open.mjs"]

[[actions]]
id = "install-hooks"
title = "Ask Inbox: Install or repair hooks"
contexts = ["global", "workspace"]
command = ["node", "bin/install-hooks.mjs"]

[[actions]]
id = "hook-status"
title = "Ask Inbox: Show hook status"
contexts = ["global", "workspace"]
command = ["node", "bin/status.mjs"]

[[actions]]
id = "uninstall-hooks"
title = "Ask Inbox: Uninstall hooks"
contexts = ["global", "workspace"]
command = ["node", "bin/uninstall-hooks.mjs"]
